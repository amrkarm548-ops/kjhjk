<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" width="1100" height="470" role="img" aria-label="Metastatic calcification three cause groups and four deposition sites">
<rect width="1100" height="470" fill="#f8fbfa"/>
<g font-family="Mulish,Arial,sans-serif">
<text x="550" y="44" text-anchor="middle" font-size="24" font-weight="800" fill="#0d5f63">METASTATIC CALCIFICATION</text>
<text x="550" y="72" text-anchor="middle" font-size="14.5" fill="#5b7c78">Calcium salts deposited in NORMAL tissues because of HYPERCALCEMIA</text>

<rect x="300" y="96" width="500" height="52" rx="12" fill="#8a5a1c"/>
<text x="550" y="120" text-anchor="middle" font-size="16.5" font-weight="800" fill="#fff">HYPERCALCEMIA (increased blood calcium)</text>
<text x="550" y="140" text-anchor="middle" font-size="11.5" fill="#fdf8e8">normal healthy tissue + high blood calcium = calcification</text>

<g stroke="#8fa8a4" stroke-width="3" fill="none">
<path d="M550 148 L550 176"/>
<path d="M550 176 L220 176 M550 176 L880 176 M220 176 L220 202 M880 176 L880 202"/>
</g>
<polygon points="220,210 212,196 228,196" fill="#8fa8a4"/>
<polygon points="880,210 872,196 888,196" fill="#8fa8a4"/>

<rect x="50" y="210" width="340" height="230" rx="14" fill="#fff" stroke="#c0392b" stroke-width="2.5"/>
<rect x="50" y="210" width="340" height="46" rx="14" fill="#c0392b"/>
<rect x="50" y="242" width="340" height="14" fill="#c0392b"/>
<text x="220" y="240" text-anchor="middle" font-size="14.5" font-weight="800" fill="#fff">1 - INTESTINAL ABSORPTION</text>
<g font-size="12.5" fill="#2b4a50">
<text x="68" y="284" font-weight="800" fill="#9c2317">Hypervitaminosis D</text>
<text x="68" y="310">Excess vitamin D raises intestinal</text>
<text x="68" y="330">calcium absorption enormously</text>
<text x="68" y="364" font-weight="800" fill="#9c2317">Excess milk intake (peptic ulcer)</text>
<text x="68" y="390">Milk-alkali syndrome: milk taken</text>
<text x="68" y="410">with alkali antacids for ulcer relief</text>
</g>

<rect x="410" y="210" width="280" height="230" rx="14" fill="#fff" stroke="#3d8fb0" stroke-width="2.5"/>
<rect x="410" y="210" width="280" height="46" rx="14" fill="#3d8fb0"/>
<rect x="410" y="242" width="280" height="14" fill="#3d8fb0"/>
<text x="550" y="240" text-anchor="middle" font-size="14.5" font-weight="800" fill="#fff">2 - BONE MOBILIZATION</text>
<g font-size="12.5" fill="#2b4a50">
<text x="428" y="284" font-weight="800" fill="#2b7290">Hyperparathyroidism (PTH)</text>
<text x="428" y="310" font-weight="800" fill="#2b7290">Prolonged immobilization</text>
<text x="428" y="336" font-weight="800" fill="#2b7290">Destructive bone disease</text>
<text x="444" y="356" font-size="11.5" fill="#5b7c78">Paget disease of bone</text>
<text x="428" y="382" font-weight="800" fill="#2b7290">Malignant bone tumors</text>
<text x="444" y="402" font-size="11.5" fill="#5b7c78">Multiple myeloma</text>
<text x="428" y="428" font-weight="800" fill="#2b7290">Diffuse skeletal metastasis</text>
</g>

<rect x="710" y="210" width="340" height="230" rx="14" fill="#fff" stroke="#6a1b9a" stroke-width="2.5"/>
<rect x="710" y="210" width="340" height="46" rx="14" fill="#6a1b9a"/>
<rect x="710" y="242" width="340" height="14" fill="#6a1b9a"/>
<text x="880" y="240" text-anchor="middle" font-size="14.5" font-weight="800" fill="#fff">3 - OTHER CAUSES</text>
<g font-size="12.5" fill="#2b4a50">
<text x="728" y="284" font-weight="800" fill="#4a148c">Sarcoidosis</text>
<text x="728" y="318" font-weight="800" fill="#4a148c">Renal failure (chronic)</text>
<text x="744" y="344">Phosphate retention</text>
<text x="744" y="368">stimulates secondary</text>
<text x="744" y="392">hyperparathyroidism</text>
</g>

<g stroke="#0d5f63" stroke-width="2.5" fill="#eef6f3">
<rect x="80" y="392" width="200" height="52" rx="9"/>
<rect x="310" y="392" width="200" height="52" rx="9"/>
<rect x="540" y="392" width="200" height="52" rx="9"/>
<rect x="770" y="392" width="200" height="52" rx="9"/>
</g>
<g font-size="13" font-weight="800" fill="#0d5f63" text-anchor="middle">
<text x="180" y="413">1 - Renal tubules</text>
<text x="180" y="432" font-size="11" font-weight="600" fill="#5b7c78">Nephrocalcinosis</text>
<text x="410" y="413">2 - Gastric mucosa</text>
<text x="410" y="432" font-size="11" font-weight="600" fill="#5b7c78">بطانة المعدة</text>
<text x="640" y="413">3 - Lung alveolar walls</text>
<text x="640" y="432" font-size="11" font-weight="600" fill="#5b7c78">جدران الحويصلات</text>
<text x="870" y="413">4 - Blood vessel media</text>
<text x="870" y="432" font-size="11" font-weight="600" fill="#5b7c78">الطبقة الوسطى</text>
</g>
<text x="550" y="458" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8a5f12">These 4 sites are alkaline mediums, which favors calcium salt precipitation</text>
</g></svg>
